<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Mirage Academy — منصة تعليمية عربية لمتابعة المحاضرات وتنظيم التقدم الدراسي.">
  <meta name="color-scheme" content="dark light">
  <title>Mirage Academy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07111f;
      --bg-soft:#0a1729;
      --surface:#0d1d32;
      --surface-2:#122641;
      --surface-3:#172f50;
      --text:#f7fbff;
      --muted:#93a6bd;
      --line:rgba(158,184,216,.14);
      --brand:#6d6aff;
      --brand-2:#28c8f6;
      --accent:#ad65ff;
      --success:#30d49c;
      --warning:#ffca66;
      --danger:#ff6685;
      --shadow:0 22px 55px rgba(0,0,0,.28);
      --nav:rgba(10,23,41,.9);
      --glass:rgba(13,29,50,.82);
      --radius:24px;
      --safe-bottom:max(14px,env(safe-area-inset-bottom));
    }
    html[data-theme="light"]{
      --bg:#f3f7fc;
      --bg-soft:#eaf1f9;
      --surface:#ffffff;
      --surface-2:#f4f7fb;
      --surface-3:#e9f0f8;
      --text:#102138;
      --muted:#60728a;
      --line:rgba(43,69,101,.12);
      --shadow:0 18px 45px rgba(34,60,89,.12);
      --nav:rgba(255,255,255,.92);
      --glass:rgba(255,255,255,.86);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      overflow-x:hidden;
      color:var(--text);
      background:
        radial-gradient(circle at 12% -8%,rgba(109,106,255,.24),transparent 34rem),
        radial-gradient(circle at 92% 18%,rgba(40,200,246,.13),transparent 28rem),
        var(--bg);
      font-family:"Tajawal",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:16px;
      -webkit-tap-highlight-color:transparent;
    }
    button,input{font:inherit}
    button{color:inherit}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:none}
    .sr-only{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0
    }
    .icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .icon.small{width:18px;height:18px}
    .app-shell{width:min(100%,1180px);min-height:100dvh;margin-inline:auto;padding-bottom:112px}
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      min-height:76px;padding:14px clamp(18px,4vw,34px);
      background:linear-gradient(to bottom,var(--bg) 58%,transparent);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{
      position:relative;display:grid;place-items:center;flex:0 0 auto;
      width:43px;height:43px;border-radius:15px;
      color:white;background:linear-gradient(145deg,var(--brand),var(--accent));
      box-shadow:0 10px 28px rgba(109,106,255,.34);
      overflow:hidden
    }
    .brand-mark:after{content:"";position:absolute;inset:1px;border-radius:14px;border:1px solid rgba(255,255,255,.25)}
    .brand-mark svg{width:25px;height:25px}
    .brand-copy{direction:ltr;text-align:left;line-height:1}
    .brand-copy strong{display:block;font-size:1.04rem;font-weight:900;letter-spacing:.01em}
    .brand-copy small{display:block;margin-top:5px;color:var(--muted);font-size:.65rem;font-weight:800;letter-spacing:.22em}
    .top-actions{display:flex;align-items:center;gap:9px}
    .icon-btn{
      display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);
      border-radius:15px;background:var(--glass);cursor:pointer;backdrop-filter:blur(16px);
      transition:transform .2s ease,background .2s ease,border-color .2s ease
    }
    .icon-btn:hover{background:var(--surface-2);border-color:rgba(109,106,255,.4)}
    .icon-btn:active{transform:scale(.94)}
    .content{padding:4px clamp(18px,4vw,34px) 24px}
    .page{animation:page-in .36s cubic-bezier(.2,.7,.2,1)}
    @keyframes page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .section{margin-top:30px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}
    .eyebrow{margin:0 0 5px;color:var(--brand-2);font-size:.78rem;font-weight:800;letter-spacing:.04em}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:8px;font-size:clamp(1.75rem,6vw,2.65rem);line-height:1.16;font-weight:900}
    h2{margin-bottom:0;font-size:clamp(1.25rem,4.5vw,1.58rem);line-height:1.25;font-weight:900}
    h3{font-size:1.06rem}
    .muted{color:var(--muted)}
    .page-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:10px 0 22px}
    .page-intro p{margin:0;line-height:1.75}
    .text-btn{border:0;background:none;color:var(--brand-2);font-weight:800;cursor:pointer;padding:7px}
    .hero{
      position:relative;isolation:isolate;display:grid;gap:24px;overflow:hidden;
      padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:30px;
      background:
        linear-gradient(128deg,rgba(109,106,255,.22),rgba(40,200,246,.05) 56%,transparent),
        var(--surface);
      box-shadow:var(--shadow)
    }
    .hero:before{
      content:"";position:absolute;z-index:-1;width:280px;height:280px;left:-90px;top:-120px;
      border-radius:50%;background:radial-gradient(circle,rgba(173,101,255,.42),transparent 68%);filter:blur(4px)
    }
    .hero:after{
      content:"";position:absolute;z-index:-1;width:220px;height:220px;right:-70px;bottom:-140px;
      border:42px solid rgba(40,200,246,.08);border-radius:50%
    }
    .hero-copy{max-width:640px}
    .hero p{max-width:570px;margin:0;color:var(--muted);line-height:1.85}
    .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-top:22px}
    .primary-btn,.secondary-btn{
      min-height:48px;padding:0 19px;border-radius:16px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;
      transition:transform .2s ease,filter .2s ease,border-color .2s ease
    }
    .primary-btn{border:0;color:white;background:linear-gradient(135deg,var(--brand),#8e63f7);box-shadow:0 12px 26px rgba(109,106,255,.26)}
    .secondary-btn{border:1px solid var(--line);background:rgba(255,255,255,.035)}
    .primary-btn:hover,.secondary-btn:hover{filter:brightness(1.08)}
    .primary-btn:active,.secondary-btn:active{transform:scale(.97)}
    .hero-meter{
      display:flex;align-items:center;gap:16px;width:max-content;max-width:100%;
      padding:15px 17px;border:1px solid var(--line);border-radius:21px;background:rgba(5,13,24,.28);
      backdrop-filter:blur(12px)
    }
    html[data-theme="light"] .hero-meter{background:rgba(255,255,255,.45)}
    .ring{
      --value:0;position:relative;display:grid;place-items:center;width:74px;height:74px;flex:0 0 auto;
      border-radius:50%;background:conic-gradient(var(--brand-2) calc(var(--value)*1%),rgba(149,171,201,.14) 0)
    }
    .ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
    .ring b{position:relative;font-size:.9rem}
    .hero-meter strong{display:block;font-size:1rem}
    .hero-meter span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}
    .search-box{position:relative;max-width:760px}
    .search-box .icon{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
    .search-input{
      width:100%;height:56px;padding:0 50px 0 18px;color:var(--text);
      border:1px solid var(--line);border-radius:18px;outline:0;background:var(--surface);
      box-shadow:0 10px 32px rgba(0,0,0,.08);transition:border-color .2s ease,box-shadow .2s ease
    }
    .search-input::placeholder{color:var(--muted)}
    .search-input:focus{border-color:rgba(109,106,255,.62);box-shadow:0 0 0 4px rgba(109,106,255,.11)}
    .search-results{display:grid;gap:10px;margin-top:12px}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
    .stat-card{padding:17px 15px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
    .stat-card .stat-icon{display:grid;place-items:center;width:38px;height:38px;margin-bottom:17px;border-radius:13px;color:var(--brand-2);background:rgba(40,200,246,.1)}
    .stat-card strong{display:block;font-size:1.38rem;font-weight:900}
    .stat-card span{display:block;margin-top:4px;color:var(--muted);font-size:.78rem}
    .teacher-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .teacher-card{
      position:relative;overflow:hidden;min-width:0;padding:0;text-align:right;
      border:1px solid var(--line);border-radius:23px;background:var(--surface);cursor:pointer;
      box-shadow:0 12px 35px rgba(0,0,0,.08);transition:transform .22s ease,border-color .22s ease
    }
    .teacher-card:hover{transform:translateY(-3px);border-color:rgba(109,106,255,.43)}
    .teacher-photo{position:relative;aspect-ratio:1.28/1;overflow:hidden;background:linear-gradient(145deg,var(--surface-2),var(--surface-3))}
    .teacher-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .45s ease}
    .teacher-card:hover img{transform:scale(1.035)}
    .teacher-photo:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--surface))}
    .teacher-body{position:relative;margin-top:-14px;padding:0 15px 16px}
    .teacher-body h3{margin:0 0 5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .teacher-body p{margin:0;color:var(--brand-2);font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .teacher-meta{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem}
    .teacher-meta span{display:flex;align-items:center;gap:5px}
    .list{display:grid;gap:11px}
    .lecture-card{
      position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:13px;
      width:100%;padding:13px;border:1px solid var(--line);border-radius:20px;text-align:right;
      background:var(--surface);cursor:pointer;transition:border-color .2s ease,transform .2s ease
    }
    .lecture-card:hover{border-color:rgba(109,106,255,.42);transform:translateY(-1px)}
    .lecture-number{
      position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:15px;
      color:var(--brand-2);font-weight:900;background:rgba(40,200,246,.09)
    }
    .lecture-card.done .lecture-number{color:#08170f;background:var(--success)}
    .lecture-copy{min-width:0}
    .lecture-copy strong{display:block;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lecture-copy span{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lecture-side{display:flex;align-items:center;gap:5px}
    .mini-btn{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:13px;color:var(--muted);background:transparent;cursor:pointer}
    .mini-btn:hover,.mini-btn.active{color:var(--warning);background:rgba(255,202,102,.1)}
    .chips{display:flex;gap:8px;overflow:auto;padding:1px 1px 8px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface);cursor:pointer}
    .chip.active{color:white;border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--accent))}
    .teacher-cover{
      position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:20px;
      padding:22px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(109,106,255,.18),transparent 55%),var(--surface)
    }
    .teacher-cover .portrait{width:96px;height:112px;overflow:hidden;border-radius:22px;background:var(--surface-2);box-shadow:0 13px 30px rgba(0,0,0,.22)}
    .teacher-cover .portrait img{width:100%;height:100%;object-fit:cover;object-position:center top}
    .teacher-cover h1{font-size:clamp(1.55rem,5vw,2.2rem)}
    .teacher-cover p{margin:0;color:var(--brand-2);font-weight:700}
    .teacher-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
    .teacher-stats span{padding:7px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:.75rem;background:rgba(0,0,0,.08)}
    .chapter-list{display:grid;gap:13px}
    .chapter{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
    .chapter-head{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:15px;
      padding:17px;border:0;text-align:right;background:transparent;cursor:pointer
    }
    .chapter-title{display:flex;align-items:center;gap:12px;min-width:0}
    .chapter-badge{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border-radius:14px;color:var(--brand-2);background:rgba(109,106,255,.12)}
    .chapter-title strong{display:block;margin-bottom:3px}
    .chapter-title small{color:var(--muted)}
    .chapter-content{display:none;padding:0 12px 12px}
    .chapter.open .chapter-content{display:grid;gap:8px;animation:page-in .25s ease}
    .chapter.open .chevron{transform:rotate(180deg)}
    .chevron{transition:transform .2s ease}
    .empty{
      padding:38px 22px;border:1px dashed var(--line);border-radius:23px;text-align:center;background:rgba(255,255,255,.018)
    }
    .empty .empty-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 16px;border-radius:20px;color:var(--brand-2);background:rgba(40,200,246,.1)}
    .empty h3{margin-bottom:7px}
    .empty p{max-width:430px;margin:0 auto;color:var(--muted);line-height:1.7}
    .profile-card{padding:22px;border:1px solid var(--line);border-radius:25px;background:var(--surface)}
    .profile-head{display:flex;align-items:center;gap:14px}
    .profile-avatar{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;color:white;background:linear-gradient(135deg,var(--brand),var(--accent));font-size:1.2rem;font-weight:900}
    .profile-head h2{font-size:1.25rem}
    .profile-head p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
    .setting-list{display:grid;gap:10px;margin-top:16px}
    .setting-row{
      width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:10px 13px;border:1px solid var(--line);border-radius:17px;text-align:right;background:var(--surface-2);cursor:pointer
    }
    .setting-label{display:flex;align-items:center;gap:11px}
    .setting-label .box{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--brand-2);background:rgba(40,200,246,.09)}
    .setting-label strong{display:block;font-size:.92rem}
    .setting-label small{display:block;margin-top:3px;color:var(--muted);font-size:.72rem}
    .danger-row .box,.danger-row>span:last-child{color:var(--danger)}
    .watch-page{max-width:980px;margin-inline:auto}
    .watch-head{display:flex;align-items:center;gap:12px;margin:3px 0 15px}
    .watch-head .icon-btn{flex:0 0 auto}
    .watch-head-copy{min-width:0}
    .watch-head h1{margin:0;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .watch-head p{margin:4px 0 0;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .player-shell{
      position:relative;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line);border-radius:24px;
      background:#02050a;box-shadow:var(--shadow)
    }
    .player-shell iframe,.player-shell video{width:100%;height:100%;border:0;display:block}
    .watch-info{padding:20px 2px}
    .watch-info h2{line-height:1.5}
    .watch-info p{margin:8px 0 0;color:var(--muted);line-height:1.75}
    .watch-controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
    .watch-controls button{flex:1 1 145px}
    .next-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .next-btn{min-height:64px;padding:10px 13px;border:1px solid var(--line);border-radius:17px;text-align:right;background:var(--surface);cursor:pointer}
    .next-btn:disabled{opacity:.4;cursor:not-allowed}
    .next-btn span{display:block;color:var(--muted);font-size:.72rem}
    .next-btn strong{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bottom-nav{
      position:fixed;z-index:40;right:50%;bottom:var(--safe-bottom);transform:translateX(50%);
      width:min(calc(100% - 24px),650px);height:72px;padding:8px;
      display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
      border:1px solid var(--line);border-radius:24px;background:var(--nav);
      box-shadow:0 18px 50px rgba(0,0,0,.35);backdrop-filter:blur(22px)
    }
    .nav-btn{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      border:0;border-radius:17px;color:var(--muted);background:transparent;cursor:pointer
    }
    .nav-btn span{font-size:.68rem;font-weight:700}
    .nav-btn.active{color:white;background:linear-gradient(135deg,rgba(109,106,255,.82),rgba(173,101,255,.66))}
    html[data-theme="light"] .nav-btn.active{color:white}
    .toast{
      position:fixed;z-index:100;left:50%;bottom:104px;transform:translate(-50%,18px);
      width:max-content;max-width:calc(100% - 34px);padding:12px 16px;border:1px solid var(--line);
      border-radius:14px;color:var(--text);background:var(--surface-3);box-shadow:var(--shadow);
      opacity:0;pointer-events:none;transition:.25s ease
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .splash{
      position:fixed;z-index:200;inset:0;display:grid;place-items:center;padding:24px;
      color:white;background:
        radial-gradient(circle at 50% 36%,rgba(109,106,255,.35),transparent 25rem),
        #06101d;transition:opacity .5s ease,visibility .5s ease
    }
    .splash.hidden{opacity:0;visibility:hidden}
    .splash-inner{text-align:center}
    .splash-logo{
      position:relative;display:grid;place-items:center;width:92px;height:92px;margin:0 auto 22px;
      border-radius:29px;background:linear-gradient(145deg,var(--brand),var(--accent));
      box-shadow:0 22px 60px rgba(109,106,255,.42);animation:splash-pulse 1.5s ease-in-out infinite
    }
    .splash-logo svg{width:54px;height:54px}
    .splash-logo:after{content:"";position:absolute;inset:-10px;border:1px solid rgba(109,106,255,.25);border-radius:35px}
    @keyframes splash-pulse{50%{transform:translateY(-5px);box-shadow:0 30px 74px rgba(109,106,255,.5)}}
    .splash h1{margin:0;font-size:1.65rem;letter-spacing:.02em}
    .splash p{margin:8px 0 25px;color:#9eb1c8;font-size:.84rem;letter-spacing:.14em}
    .loader{width:62px;height:4px;margin:auto;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}
    .loader:after{content:"";display:block;width:35%;height:100%;border-radius:inherit;background:var(--brand-2);animation:load 1s ease-in-out infinite}
    @keyframes load{from{transform:translateX(190%)}to{transform:translateX(-290%)}}
    .confirm-backdrop{position:fixed;z-index:120;inset:0;display:grid;place-items:center;padding:20px;background:rgba(1,5,12,.72);backdrop-filter:blur(8px)}
    .confirm{width:min(100%,390px);padding:23px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
    .confirm h3{margin-bottom:8px;font-size:1.18rem}
    .confirm p{color:var(--muted);line-height:1.7}
    .confirm-actions{display:flex;gap:9px;margin-top:20px}
    .confirm-actions button{flex:1}
    .skeleton{position:relative;overflow:hidden;background:var(--surface-2)}
    .skeleton:after{content:"";position:absolute;inset:0;transform:translateX(100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shimmer 1.2s infinite}
    @keyframes shimmer{to{transform:translateX(-100%)}}
    :focus-visible{outline:3px solid rgba(40,200,246,.55);outline-offset:3px}
    @media(min-width:700px){
      .hero{grid-template-columns:minmax(0,1fr) auto;align-items:center}
      .teacher-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .stats-grid{gap:15px}
      .stat-card{padding:20px}
      .teacher-cover{grid-template-columns:130px minmax(0,1fr);padding:28px}
      .teacher-cover .portrait{width:130px;height:150px}
      .chapter-content{padding:0 15px 15px}
    }
    @media(min-width:980px){
      .teacher-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .home-lower{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.7fr);gap:25px;align-items:start}
      .home-lower .section{margin-top:30px}
      .teacher-page-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.7fr);gap:22px;align-items:start}
      .teacher-page-layout .teacher-cover{grid-column:1/-1}
    }
    @media(max-width:470px){
      .brand-copy small{display:none}
      .teacher-grid{grid-template-columns:1fr 1fr}
      .teacher-photo{aspect-ratio:1/1}
      .stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .stat-card{padding:14px 10px}
      .stat-card .stat-icon{margin-bottom:12px}
      .stat-card strong{font-size:1.17rem}
      .stat-card span{font-size:.68rem}
      .teacher-cover{grid-template-columns:80px minmax(0,1fr);gap:14px;padding:17px}
      .teacher-cover .portrait{width:80px;height:96px}
      .next-grid{grid-template-columns:1fr}
      .player-shell{margin-inline:-18px;border-radius:0;border-left:0;border-right:0}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>

    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.2-2L20 12M4 12l2.7 5a7 7 0 0 0 11.2-2"/></symbol>

    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4Z"/><path d="M20 4h-3a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h3Z"/></symbol>
    <symbol id="i-mirage" viewBox="0 0 32 32"><path d="M5 24V8l11 9L27 8v16"/><path d="M10 24V18l6 5 6-5v6"/></symbol>
  </svg>

  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-logo"><svg class="icon" viewBox="0 0 32 32"><use href="#i-mirage"></use></svg></div>
      <h1>Mirage Academy</h1>
      <p>LEARN · GROW · ACHIEVE</p>
      <div class="loader" aria-label="جارٍ تحميل المنصة"></div>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/home" aria-label="Mirage Academy — الرئيسية">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 32 32"><use href="#i-mirage"></use></svg></span>
        <span class="brand-copy"><strong>Mirage</strong><small>ACADEMY</small></span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="searchShortcut" aria-label="البحث">
          <svg class="icon"><use href="#i-search"></use></svg>
        </button>
        <button class="icon-btn" id="themeShortcut" aria-label="تغيير المظهر">
          <svg class="icon" id="themeIcon"><use href="#i-sun"></use></svg>
        </button>
      </div>
    </header>

    <main class="content" id="app" aria-live="polite">
      <div class="page">
        <div class="hero skeleton" style="min-height:260px"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="التنقل الرئيسي">
    <button class="nav-btn active" data-route="home"><svg class="icon"><use href="#i-home"></use></svg><span>الرئيسية</span></button>
    <button class="nav-btn" data-route="teachers"><svg class="icon"><use href="#i-users"></use></svg><span>المدرسون</span></button>
    <button class="nav-btn" data-route="saved"><svg class="icon"><use href="#i-bookmark"></use></svg><span>المحفوظة</span></button>
    <button class="nav-btn" data-route="profile"><svg class="icon"><use href="#i-user"></use></svg><span>حسابي</span></button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <script>
    (function(){
      "use strict";

      var STORAGE = {
        progress: "mirage:progress:v1",
        favorites: "mirage:favorites:v1",
        theme: "mirage:theme:v1"
      };
      var state = {
        data: null,
        lectures: [],
        progress: readJSON(STORAGE.progress, {}),
        favorites: new Set(readJSON(STORAGE.favorites, [])),
        chapterOpen: {},
        teacherFilter: "الكل",
        installPrompt: null,
        loadedAt: Date.now()
      };
      var app = document.getElementById("app");
      var splash = document.getElementById("splash");
      var nav = document.getElementById("bottomNav");
      var toast = document.getElementById("toast");
      var toastTimer;

      function readJSON(key, fallback){
        try {
          var value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch(error) {
          return fallback;
        }
      }

      function writeJSON(key, value){
        try { localStorage.setItem(key, JSON.stringify(value)); } catch(error) {}
      }

      function esc(value){
        return String(value == null ? "" : value)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
      }

      function icon(name, small){
        return '<svg class="icon' + (small ? ' small' : '') + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
      }

      function showToast(message){
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
      }

      function greeting(){
        var hour = new Date().getHours();
        if(hour < 5) return "ليلة هادئة";
        if(hour < 12) return "صباح الخير";
        if(hour < 18) return "مساء الخير";
        return "مساء الإنجاز";
      }

      function buildLectureIndex(){
        state.lectures = [];
        state.data.teachers.forEach(function(teacher, teacherIndex){
          teacher.classes.forEach(function(chapter, chapterIndex){
            chapter.lectures.forEach(function(lecture, lectureIndex){
              state.lectures.push({
                id: String(teacher.id) + ":" + chapterIndex + ":" + lectureIndex,
                teacherId: String(teacher.id),
                teacherIndex: teacherIndex,
                chapterIndex: chapterIndex,
                lectureIndex: lectureIndex,
                teacher: teacher,
                chapter: chapter,
                title: lecture.title,
                description: lecture.description || lecture.title,
                url: lecture.url
              });
            });
          });
        });
      }

      function getLecture(id){
        return state.lectures.find(function(item){ return item.id === String(id); });
      }

      function getTeacher(id){
        return state.data.teachers.find(function(item){ return String(item.id) === String(id); });
      }

      function completedCount(){
        return state.lectures.filter(function(item){ return state.progress[item.id] && state.progress[item.id].completed; }).length;
      }

      function chapterCount(){
        return state.data.teachers.reduce(function(total,teacher){ return total + teacher.classes.length; },0);
      }

      function completionPercent(){
        return state.lectures.length ? Math.round((completedCount() / state.lectures.length) * 100) : 0;
      }

      function recentLectures(){
        return state.lectures
          .filter(function(item){ return state.progress[item.id] && state.progress[item.id].viewedAt; })
          .sort(function(a,b){ return state.progress[b.id].viewedAt - state.progress[a.id].viewedAt; });
      }

      function teacherProgress(teacher){
        var rows = state.lectures.filter(function(item){ return item.teacherId === String(teacher.id); });
        var done = rows.filter(function(item){ return state.progress[item.id] && state.progress[item.id].completed; }).length;
        return {done:done,total:rows.length,percent:rows.length ? Math.round(done / rows.length * 100) : 0};
      }

      function navRoute(){
        var part = (location.hash.replace(/^#\//,"").split("/")[0] || "home");
        if(part === "teacher" || part === "watch") return "teachers";
        return ["home","teachers","saved","profile"].indexOf(part) >= 0 ? part : "home";
      }

      function syncNav(){
        var active = navRoute();
        nav.querySelectorAll(".nav-btn").forEach(function(button){
          button.classList.toggle("active",button.dataset.route === active);
        });
        var watching = location.hash.indexOf("#/watch/") === 0;
        nav.style.display = watching ? "none" : "grid";
        document.querySelector(".app-shell").style.paddingBottom = watching ? "34px" : "112px";
      }

      function go(path){
        var target = "#/" + path.replace(/^\//,"");
        if(location.hash === target) renderRoute();
        else location.hash = target;
      }

      function teacherCard(teacher){
        var progress = teacherProgress(teacher);
        return [
          '<button class="teacher-card" data-action="open-teacher" data-teacher="',esc(teacher.id),'">',
            '<div class="teacher-photo"><img src="',esc(teacher.image),'" alt="',esc(teacher.name),'" loading="lazy"></div>',
            '<div class="teacher-body">',
              '<h3>',esc(teacher.name),'</h3>',
              '<p>',esc(teacher.subject),'</p>',
              '<div class="teacher-meta">',
                '<span>',icon("video",true),progress.total,' محاضرة</span>',
                '<span>',progress.percent,'% مكتمل</span>',
              '</div>',
            '</div>',
          '</button>'
        ].join("");
      }

      function lectureCard(item, number, subtitle){
        var progress = state.progress[item.id] || {};
        var favorite = state.favorites.has(item.id);
        return [
          '<article class="lecture-card ',progress.completed ? 'done' : '', '" data-action="watch" data-lecture="',esc(item.id),'">',
            '<div class="lecture-number">',progress.completed ? icon("check",true) : esc(number || item.lectureIndex + 1),'</div>',
            '<div class="lecture-copy">',
              '<strong>',esc(item.title),'</strong>',
              '<span>',esc(subtitle || item.teacher.name + " · " + item.chapter.name),'</span>',
            '</div>',
            '<div class="lecture-side">',
              '<button class="mini-btn ',favorite ? 'active' : '', '" data-action="favorite" data-lecture="',esc(item.id),'" aria-label="',favorite ? 'إزالة من المحفوظة' : 'حفظ المحاضرة','">',icon("star",true),'</button>',
              icon("play",false),
            '</div>',
          '</article>'
        ].join("");
      }

      function emptyState(iconName,title,message,action){
        return [
          '<div class="empty">',
            '<div class="empty-icon">',icon(iconName,false),'</div>',
            '<h3>',esc(title),'</h3>',
            '<p>',esc(message),'</p>',
            action ? '<button class="primary-btn" style="margin-top:18px" data-action="' + esc(action.name) + '">' + esc(action.label) + '</button>' : '',
          '</div>'
        ].join("");
      }

      function renderHome(){
        var recent = recentLectures();
        var next = recent[0] || state.lectures[0];
        var percent = completionPercent();
        return [
          '<div class="page">',
            '<section class="hero">',
              '<div class="hero-copy">',
                '<p class="eyebrow">',greeting(),'</p>',
                '<h1>',recent.length ? 'كمل من المكان الذي توقفت عنده' : 'رحلتك الدراسية تبدأ من هنا','</h1>',
                '<p>',recent.length ? 'محاضرتك الأخيرة جاهزة، وكل خطوة تنجزها تُحفظ تلقائيًا على هذا الجهاز.' : 'جميع محاضراتك مرتبة حسب المدرس والفصل، مع بحث سريع وحفظ للتقدم.','</p>',
                '<div class="hero-actions">',
                  '<button class="primary-btn" data-action="watch" data-lecture="',esc(next.id),'">',icon("play",true),recent.length ? 'متابعة المحاضرة' : 'ابدأ أول محاضرة','</button>',
                  '<button class="secondary-btn" data-action="route" data-route="teachers">',icon("users",true),'تصفح المدرسين</button>',
                '</div>',
              '</div>',
              '<div class="hero-meter">',
                '<div class="ring" style="--value:',percent,'"><b>',percent,'%</b></div>',
                '<div><strong>تقدمك العام</strong><span>',completedCount(),' من ',state.lectures.length,' محاضرة</span></div>',
              '</div>',
            '</section>',

            '<section class="section">',
              '<div class="section-head"><div><p class="eyebrow">وصول سريع</p><h2>ابحث في المنصة</h2></div></div>',
              '<div class="search-box">',
                icon("search",false),
                '<input class="search-input" id="globalSearch" type="search" inputmode="search" autocomplete="off" placeholder="اسم المدرس، المادة أو المحاضرة..." aria-label="البحث في المنصة">',
              '</div>',
              '<div class="search-results" id="searchResults"></div>',
            '</section>',

            '<div class="home-lower">',
              '<section class="section">',
                '<div class="section-head"><div><p class="eyebrow">هيئة التدريس</p><h2>مدرسوك</h2></div><button class="text-btn" data-action="route" data-route="teachers">عرض الكل</button></div>',
                '<div class="teacher-grid">',state.data.teachers.map(teacherCard).join(""),'</div>',
              '</section>',
              '<section class="section">',
                '<div class="section-head"><div><p class="eyebrow">لوحة التقدم</p><h2>نظرة سريعة</h2></div></div>',
                '<div class="stats-grid">',
                  '<div class="stat-card"><span class="stat-icon">',icon("users",true),'</span><strong>',state.data.teachers.length,'</strong><span>مدرسون</span></div>',
                  '<div class="stat-card"><span class="stat-icon">',icon("layers",true),'</span><strong>',chapterCount(),'</strong><span>فصول</span></div>',
                  '<div class="stat-card"><span class="stat-icon">',icon("video",true),'</span><strong>',state.lectures.length,'</strong><span>محاضرات</span></div>',
                '</div>',
              '</section>',
            '</div>',

            recent.length ? [
              '<section class="section">',
                '<div class="section-head"><div><p class="eyebrow">شاهدت مؤخرًا</p><h2>أكمل المشاهدة</h2></div></div>',
                '<div class="list">',recent.slice(0,4).map(function(item,index){ return lectureCard(item,index+1); }).join(""),'</div>',
              '</section>'
            ].join("") : '',
          '</div>'
        ].join("");
      }

      function renderTeachers(){
        var subjects = ["الكل"].concat(state.data.teachers.map(function(t){ return t.subject; }).filter(function(v,i,a){ return a.indexOf(v) === i; }));
        var shown = state.teacherFilter === "الكل" ? state.data.teachers : state.data.teachers.filter(function(t){ return t.subject === state.teacherFilter; });
        return [
          '<div class="page">',
            '<div class="page-intro"><div><p class="eyebrow">المحتوى التعليمي</p><h1>المدرسون</h1><p>اختر المدرس للوصول إلى الفصول والمحاضرات.</p></div></div>',
            '<div class="search-box">',icon("search",false),'<input class="search-input" id="teacherSearch" type="search" placeholder="ابحث عن مدرس أو مادة..." aria-label="البحث عن مدرس"></div>',
            '<div class="chips section" style="margin-top:15px">',subjects.map(function(subject){
              return '<button class="chip ' + (state.teacherFilter === subject ? 'active' : '') + '" data-action="filter-subject" data-subject="' + esc(subject) + '">' + esc(subject) + '</button>';
            }).join(""),'</div>',
            '<div class="teacher-grid section" id="teacherGrid" style="margin-top:11px">',shown.map(teacherCard).join(""),'</div>',
          '</div>'
        ].join("");
      }

      function renderTeacher(id){
        var teacher = getTeacher(id);
        if(!teacher) return renderMissing();
        var progress = teacherProgress(teacher);
        var recent = recentLectures().find(function(item){ return item.teacherId === String(teacher.id) && !state.progress[item.id].completed; });
        var firstIncomplete = state.lectures.find(function(item){ return item.teacherId === String(teacher.id) && !(state.progress[item.id] && state.progress[item.id].completed); });
        var next = recent || firstIncomplete || state.lectures.find(function(item){ return item.teacherId === String(teacher.id); });
        var openKey = state.chapterOpen[String(teacher.id)];
        if(openKey == null) openKey = 0;
        return [
          '<div class="page teacher-page-layout">',
            '<section class="teacher-cover">',
              '<div class="portrait"><img src="',esc(teacher.image),'" alt="',esc(teacher.name),'"></div>',
              '<div>',
                '<p class="eyebrow">',esc(teacher.subject),'</p>',
                '<h1>',esc(teacher.name),'</h1>',
                '<p>',progress.percent,'% من محتوى المدرس مكتمل</p>',
                '<div class="teacher-stats"><span>',teacher.classes.length,' فصول</span><span>',progress.total,' محاضرة</span><span>',progress.done,' مكتملة</span></div>',
                next ? '<button class="primary-btn" style="margin-top:16px" data-action="watch" data-lecture="' + esc(next.id) + '">' + icon("play",true) + 'ابدأ أو تابع</button>' : '',
              '</div>',
            '</section>',
            '<section class="section" style="margin-top:22px">',
              '<div class="section-head"><div><p class="eyebrow">المنهج</p><h2>الفصول والمحاضرات</h2></div></div>',
              '<div class="chapter-list">',
                teacher.classes.map(function(chapter,chapterIndex){
                  var rows = state.lectures.filter(function(item){ return item.teacherId === String(teacher.id) && item.chapterIndex === chapterIndex; });
                  var done = rows.filter(function(item){ return state.progress[item.id] && state.progress[item.id].completed; }).length;
                  return [
                    '<div class="chapter ',Number(openKey) === chapterIndex ? 'open' : '', '">',
                      '<button class="chapter-head" data-action="chapter" data-teacher="',esc(teacher.id),'" data-chapter="',chapterIndex,'">',
                        '<span class="chapter-title"><span class="chapter-badge">',icon("book",false),'</span><span><strong>',esc(chapter.name),'</strong><small>',done,' من ',rows.length,' مكتملة</small></span></span>',
                        '<span class="chevron">',icon("chevron",false),'</span>',
                      '</button>',
                      '<div class="chapter-content">',rows.map(function(item,index){ return lectureCard(item,index+1,chapter.name); }).join(""),'</div>',
                    '</div>'
                  ].join("");
                }).join(""),
              '</div>',
            '</section>',
            '<aside class="section" style="margin-top:22px">',
              '<div class="section-head"><div><p class="eyebrow">التقدم</p><h2>إنجازك</h2></div></div>',
              '<div class="profile-card">',
                '<div class="hero-meter" style="width:100%;background:var(--surface-2)">',
                  '<div class="ring" style="--value:',progress.percent,'"><b>',progress.percent,'%</b></div>',
                  '<div><strong>أحسنت، استمر</strong><span>',progress.done,' محاضرة مكتملة</span></div>',
                '</div>',
              '</div>',
            '</aside>',
          '</div>'
        ].join("");
      }

      function renderSaved(){
        var favorites = state.lectures.filter(function(item){ return state.favorites.has(item.id); });
        var completed = state.lectures.filter(function(item){ return state.progress[item.id] && state.progress[item.id].completed; });
        return [
          '<div class="page">',
            '<div class="page-intro"><div><p class="eyebrow">مكتبتك</p><h1>المحفوظة</h1><p>المحاضرات المفضلة وإنجازاتك في مكان واحد.</p></div></div>',
            '<section>',
              '<div class="section-head"><div><h2>المفضلة</h2></div><span class="muted">',favorites.length,'</span></div>',
              favorites.length ? '<div class="list">' + favorites.map(function(item,index){ return lectureCard(item,index+1); }).join("") + '</div>' : emptyState("bookmark","لا توجد محاضرات محفوظة","اضغط النجمة بجانب أي محاضرة لتجدها هنا.",{name:"browse-teachers",label:"تصفح المحاضرات"}),
            '</section>',
            '<section class="section">',
              '<div class="section-head"><div><h2>المكتملة</h2></div><span class="muted">',completed.length,'</span></div>',
              completed.length ? '<div class="list">' + completed.slice().reverse().map(function(item,index){ return lectureCard(item,index+1); }).join("") + '</div>' : emptyState("check","لم تُكمل محاضرة بعد","بعد إنهاء المحاضرة علّمها كمكتملة لمتابعة تقدمك."),
            '</section>',
          '</div>'
        ].join("");
      }

      function renderProfile(){
        var theme = document.documentElement.dataset.theme || "dark";
        return [
          '<div class="page">',
            '<div class="page-intro"><div><p class="eyebrow">إعداداتك</p><h1>حسابي</h1><p>يُحفظ تقدمك محليًا على هذا الجهاز.</p></div></div>',
            '<section class="profile-card">',
              '<div class="profile-head"><div class="profile-avatar">MA</div><div><h2>طالب Mirage Academy</h2><p>',completedCount(),' محاضرة مكتملة من أصل ',state.lectures.length,'</p></div></div>',
              '<div class="hero-meter" style="width:100%;margin-top:20px;background:var(--surface-2)">',
                '<div class="ring" style="--value:',completionPercent(),'"><b>',completionPercent(),'%</b></div>',
                '<div><strong>تقدمك الدراسي</strong><span>استمر، كل محاضرة تقرّبك من هدفك</span></div>',
              '</div>',
            '</section>',
            '<section class="section">',
              '<div class="section-head"><div><h2>التفضيلات</h2></div></div>',
              '<div class="setting-list">',
                '<button class="setting-row" data-action="toggle-theme"><span class="setting-label"><span class="box">',icon(theme === "dark" ? "moon" : "sun",true),'</span><span><strong>مظهر المنصة</strong><small>',theme === "dark" ? 'الوضع الداكن' : 'الوضع الفاتح','</small></span></span><span>',theme === "dark" ? 'تبديل للفاتح' : 'تبديل للداكن','</span></button>',
                state.installPrompt ? '<button class="setting-row" data-action="install"><span class="setting-label"><span class="box">' + icon("download",true) + '</span><span><strong>تثبيت التطبيق</strong><small>أضف Mirage Academy إلى جهازك</small></span></span><span>' + icon("arrow",true) + '</span></button>' : '',
                '<button class="setting-row" data-action="reload-data"><span class="setting-label"><span class="box">',icon("refresh",true),'</span><span><strong>تحديث المحتوى</strong><small>إعادة تحميل ملف البيانات</small></span></span><span>',icon("arrow",true),'</span></button>',
                '<button class="setting-row danger-row" data-action="confirm-reset"><span class="setting-label"><span class="box">',icon("trash",true),'</span><span><strong>مسح التقدم</strong><small>حذف التقدم والمفضلة من هذا الجهاز</small></span></span><span>',icon("arrow",true),'</span></button>',
              '</div>',
            '</section>',
            '<section class="section">',
              '<div class="profile-card">',
                '<div class="setting-label"><span class="box">',icon("info",true),'</span><span><strong>Mirage Academy</strong><small>نسخة الويب 1.0 · ',state.data.teachers.length,' مدرسين · ',state.lectures.length,' محاضرة</small></span></div>',
              '</div>',
            '</section>',
          '</div>'
        ].join("");
      }

      function safeVideoUrl(url){
        try {
          var parsed = new URL(url);
          return parsed.protocol === "https:" ? parsed.href : "";
        } catch(error) {
          return "";
        }
      }

      function renderWatch(id){
        var item = getLecture(id);
        if(!item) return renderMissing();
        var url = safeVideoUrl(item.url);
        var progress = state.progress[item.id] || {};
        if(!progress.viewedAt){
          progress.viewedAt = Date.now();
          state.progress[item.id] = progress;
          writeJSON(STORAGE.progress,state.progress);
        } else {
          progress.viewedAt = Date.now();
          writeJSON(STORAGE.progress,state.progress);
        }
        var sameChapter = state.lectures.filter(function(row){ return row.teacherId === item.teacherId && row.chapterIndex === item.chapterIndex; });
        var position = sameChapter.findIndex(function(row){ return row.id === item.id; });
        var previous = position > 0 ? sameChapter[position-1] : null;
        var next = position < sameChapter.length-1 ? sameChapter[position+1] : null;
        var player = "";
        if(!url){
          player = emptyState("video","الرابط غير صالح","تعذر فتح رابط هذه المحاضرة.");
        } else if(/\.(mp4|webm|ogg)(\?|$)/i.test(url)){
          player = '<video src="' + esc(url) + '" controls playsinline preload="metadata"></video>';
        } else {
          player = '<iframe src="' + esc(url) + '" title="' + esc(item.title) + '" loading="eager" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
        }
        return [
          '<div class="page watch-page">',
            '<div class="watch-head">',
              '<button class="icon-btn" data-action="back" data-teacher="',esc(item.teacherId),'" aria-label="رجوع">',icon("arrow",false),'</button>',
              '<div class="watch-head-copy"><h1>',esc(item.title),'</h1><p>',esc(item.teacher.name),' · ',esc(item.chapter.name),'</p></div>',
            '</div>',
            '<div class="player-shell">',player,'</div>',
            '<div class="watch-info">',
              '<p class="eyebrow">المحاضرة ',item.lectureIndex + 1,' من ',sameChapter.length,'</p>',
              '<h2>',esc(item.title),'</h2>',
              '<p>',esc(item.description),'</p>',
              '<div class="watch-controls">',
                '<button class="primary-btn" data-action="complete" data-lecture="',esc(item.id),'">',icon(progress.completed ? "refresh" : "check",true),progress.completed ? 'إلغاء علامة الاكتمال' : 'تحديد كمكتملة','</button>',
                '<button class="secondary-btn" data-action="favorite" data-lecture="',esc(item.id),'">',icon("star",true),state.favorites.has(item.id) ? 'إزالة من المحفوظة' : 'حفظ المحاضرة','</button>',
              '</div>',
              '<div class="next-grid">',
                '<button class="next-btn" ',previous ? 'data-action="watch" data-lecture="' + esc(previous.id) + '"' : 'disabled','><span>المحاضرة السابقة</span><strong>',previous ? esc(previous.title) : 'لا توجد','</strong></button>',
                '<button class="next-btn" ',next ? 'data-action="watch" data-lecture="' + esc(next.id) + '"' : 'disabled','><span>المحاضرة التالية</span><strong>',next ? esc(next.title) : 'نهاية الفصل','</strong></button>',
              '</div>',
            '</div>',
          '</div>'
        ].join("");
      }

      function renderMissing(){
        return '<div class="page">' + emptyState("info","الصفحة غير موجودة","قد يكون الرابط قديمًا أو أن المحتوى لم يعد متاحًا.",{name:"go-home",label:"العودة للرئيسية"}) + '</div>';
      }

      function renderRoute(){
        if(!state.data) return;
        var parts = location.hash.replace(/^#\//,"").split("/");
        var route = parts[0] || "home";
        var html;
        if(route === "home") html = renderHome();
        else if(route === "teachers") html = renderTeachers();
        else if(route === "teacher") html = renderTeacher(decodeURIComponent(parts[1] || ""));
        else if(route === "saved") html = renderSaved();
        else if(route === "profile") html = renderProfile();
        else if(route === "watch") html = renderWatch(decodeURIComponent(parts.slice(1).join("/") || ""));
        else html = renderMissing();
        app.innerHTML = html;
        syncNav();
        window.scrollTo({top:0,behavior:"auto"});
      }

      function search(query){
        var normalized = String(query || "").trim().toLowerCase();
        if(!normalized) return [];
        return state.lectures.filter(function(item){
          return [item.title,item.description,item.teacher.name,item.teacher.subject,item.chapter.name]
            .join(" ").toLowerCase().indexOf(normalized) >= 0;
        }).slice(0,8);
      }

      function updateGlobalSearch(query){
        var results = document.getElementById("searchResults");
        if(!results) return;
        if(!query.trim()){
          results.innerHTML = "";
          return;
        }
        var rows = search(query);
        results.innerHTML = rows.length ? rows.map(function(item,index){ return lectureCard(item,index+1); }).join("") : emptyState("search","لا توجد نتائج","جرّب كتابة اسم المدرس أو جزءًا من عنوان المحاضرة.");
      }

      function updateTeacherSearch(query){
        var grid = document.getElementById("teacherGrid");
        if(!grid) return;
        var normalized = query.trim().toLowerCase();
        var rows = state.data.teachers.filter(function(teacher){
          var filterOk = state.teacherFilter === "الكل" || teacher.subject === state.teacherFilter;
          var searchOk = !normalized || (teacher.name + " " + teacher.subject).toLowerCase().indexOf(normalized) >= 0;
          return filterOk && searchOk;
        });
        grid.innerHTML = rows.length ? rows.map(teacherCard).join("") : emptyState("search","لا يوجد مدرس مطابق","غيّر عبارة البحث أو اختر مادة أخرى.");
      }

      function toggleFavorite(id){
        if(state.favorites.has(id)){
          state.favorites.delete(id);
          showToast("تمت الإزالة من المحفوظة");
        } else {
          state.favorites.add(id);
          showToast("تم حفظ المحاضرة");
        }
        writeJSON(STORAGE.favorites,Array.from(state.favorites));
        if(location.hash.indexOf("#/watch/") === 0){
          var watchButton = app.querySelector(".watch-controls [data-action='favorite']");
          if(watchButton){
            watchButton.innerHTML = icon("star",true) + (state.favorites.has(id) ? "إزالة من المحفوظة" : "حفظ المحاضرة");
          }
        } else {
          renderRoute();
        }
      }

      function toggleComplete(id){
        var current = state.progress[id] || {};
        current.completed = !current.completed;
        current.viewedAt = Date.now();
        state.progress[id] = current;
        writeJSON(STORAGE.progress,state.progress);
        showToast(current.completed ? "أحسنت! تم تسجيل المحاضرة كمكتملة" : "تم إلغاء علامة الاكتمال");
        if(location.hash.indexOf("#/watch/") === 0){
          var completeButton = app.querySelector(".watch-controls [data-action='complete']");
          if(completeButton){
            completeButton.innerHTML = icon(current.completed ? "refresh" : "check",true) + (current.completed ? "إلغاء علامة الاكتمال" : "تحديد كمكتملة");
          }
        } else {
          renderRoute();
        }
      }

      function toggleTheme(){
        var current = document.documentElement.dataset.theme || "dark";
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem(STORAGE.theme,next);
        updateThemeIcon();
        renderRoute();
      }

      function updateThemeIcon(){
        var use = document.querySelector("#themeIcon use");
        if(use) use.setAttribute("href",document.documentElement.dataset.theme === "light" ? "#i-moon" : "#i-sun");
      }

      function confirmReset(){
        var backdrop = document.createElement("div");
        backdrop.className = "confirm-backdrop";
        backdrop.innerHTML = [
          '<div class="confirm" role="dialog" aria-modal="true" aria-labelledby="resetTitle">',
            '<h3 id="resetTitle">مسح التقدم؟</h3>',
            '<p>سيتم حذف علامات الاكتمال والمفضلة من هذا الجهاز، ولا يمكن التراجع عن ذلك.</p>',
            '<div class="confirm-actions">',
              '<button class="secondary-btn" data-confirm="cancel">إلغاء</button>',
              '<button class="primary-btn" data-confirm="reset">مسح البيانات</button>',
            '</div>',
          '</div>'
        ].join("");
        backdrop.addEventListener("click",function(event){
          var action = event.target.closest("[data-confirm]");
          if(!action && event.target !== backdrop) return;
          if(action && action.dataset.confirm === "reset"){
            state.progress = {};
            state.favorites = new Set();
            writeJSON(STORAGE.progress,{});
            writeJSON(STORAGE.favorites,[]);
            showToast("تم مسح التقدم والمفضلة");
            backdrop.remove();
            renderRoute();
          } else if(event.target === backdrop || (action && action.dataset.confirm === "cancel")) {
            backdrop.remove();
          }
        });
        document.body.appendChild(backdrop);
      }

      async function loadData(force){
        try {
          var response = await fetch("data.json" + (force ? "?v=" + Date.now() : ""),{cache:force ? "no-store" : "default"});
          if(!response.ok) throw new Error("HTTP " + response.status);
          var data = await response.json();
          if(!data || !Array.isArray(data.teachers)) throw new Error("Invalid data");
          state.data = data;
          buildLectureIndex();
          renderRoute();
          if(force) showToast("تم تحديث المحتوى");
        } catch(error) {
          app.innerHTML = [
            '<div class="page">',
              '<div class="empty" style="margin-top:30px">',
                '<div class="empty-icon">',icon("refresh",false),'</div>',
                '<h3>تعذر تحميل المحتوى</h3>',
                '<p>تأكد من اتصال الإنترنت ثم أعد المحاولة. عند فتح الملفات محليًا شغّلها عبر خادم ويب بدل فتح ملف HTML مباشرة.</p>',
                '<button class="primary-btn" style="margin-top:18px" data-action="retry">إعادة المحاولة</button>',
              '</div>',
            '</div>'
          ].join("");
        } finally {
          var elapsed = Date.now() - state.loadedAt;
          setTimeout(function(){ splash.classList.add("hidden"); },Math.max(0,900-elapsed));
        }
      }

      app.addEventListener("click",function(event){
        var target = event.target.closest("[data-action]");
        if(!target) return;
        var action = target.dataset.action;
        if(action === "route") go(target.dataset.route);
        else if(action === "open-teacher") go("teacher/" + encodeURIComponent(target.dataset.teacher));
        else if(action === "watch"){
          if(event.target.closest(".mini-btn")) return;
          go("watch/" + encodeURIComponent(target.dataset.lecture));
        }
        else if(action === "favorite"){
          event.preventDefault();
          event.stopPropagation();
          toggleFavorite(target.dataset.lecture);
        }
        else if(action === "complete") toggleComplete(target.dataset.lecture);
        else if(action === "chapter"){
          var key = target.dataset.teacher;
          var chapter = Number(target.dataset.chapter);
          state.chapterOpen[key] = Number(state.chapterOpen[key]) === chapter ? -1 : chapter;
          renderRoute();
        }
        else if(action === "filter-subject"){
          state.teacherFilter = target.dataset.subject;
          renderRoute();
        }
        else if(action === "back"){
          if(history.length > 1) history.back();
          else go("teacher/" + encodeURIComponent(target.dataset.teacher));
        }
        else if(action === "toggle-theme") toggleTheme();
        else if(action === "reload-data" || action === "retry") loadData(true);
        else if(action === "confirm-reset") confirmReset();
        else if(action === "browse-teachers") go("teachers");
        else if(action === "go-home") go("home");
        else if(action === "install" && state.installPrompt){
          state.installPrompt.prompt();
          state.installPrompt.userChoice.finally(function(){ state.installPrompt = null; renderRoute(); });
        }
      });

      app.addEventListener("input",function(event){
        if(event.target.id === "globalSearch") updateGlobalSearch(event.target.value);
        if(event.target.id === "teacherSearch") updateTeacherSearch(event.target.value);
      });

      nav.addEventListener("click",function(event){
        var button = event.target.closest("[data-route]");
        if(button) go(button.dataset.route);
      });

      document.getElementById("searchShortcut").addEventListener("click",function(){
        go("home");
        setTimeout(function(){
          var input = document.getElementById("globalSearch");
          if(input){ input.focus(); input.scrollIntoView({behavior:"smooth",block:"center"}); }
        },80);
      });
      document.getElementById("themeShortcut").addEventListener("click",toggleTheme);

      document.addEventListener("error",function(event){
        if(event.target && event.target.tagName === "IMG") event.target.style.display = "none";
      },true);

      window.addEventListener("hashchange",renderRoute);
      window.addEventListener("beforeinstallprompt",function(event){
        event.preventDefault();
        state.installPrompt = event;
        if(navRoute() === "profile") renderRoute();
      });

      var savedTheme = localStorage.getItem(STORAGE.theme);
      var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = savedTheme || (prefersLight ? "light" : "dark");
      updateThemeIcon();
      if(!location.hash) history.replaceState(null,"","#/home");
      loadData(false);

      if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
        window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
      }
    })();
  </script>
</body>
</html>
